name: Build Recipa APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp recipa-language-system.html www/index.html
          cp config.js www/config.js

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init Recipa com.recipa.app --web-dir www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert Icon-512.png -resize 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          npx capacitor-assets generate --android

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Recipa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
